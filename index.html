<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Installation Engine DEBUG</title>

<style>
  body { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<script>
console.log("🏛️ ENGINE START");

/* ========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth/window.innerHeight, 0.1, 1000
);

camera.position.z = 90;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* CORE */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(7,32,32),
  new THREE.MeshBasicMaterial({ color:0xff00ff })
);
scene.add(core);

/* STATE */
let nodes = [];
let velocity = [];

/* =========================
   SAFE FETCH (IMPORTANT FIX)
========================= */
async function loadData(file) {
  try {
    const res = await fetch("./data/" + file);

    if (!res.ok) {
      console.warn("❌ fetch failed:", file, res.status);
      return { title: file, nodes: ["fallback node"] };
    }

    const json = await res.json();

    if (!json.nodes) {
      console.warn("⚠️ invalid json:", file);
      return { title: file, nodes: ["fallback node"] };
    }

    return json;

  } catch (e) {
    console.warn("❌ crash loading:", file, e);
    return { title: file, nodes: ["fallback node"] };
  }
}

/* =========================
   FIELD
========================= */
function buildField(data, offsetX) {

  data.nodes.forEach((word) => {

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(2.5,16,16),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(`hsl(${Math.random()*360},100%,60%)`)
      })
    );

    mesh.position.set(
      offsetX + (Math.random()-0.5)*60,
      (Math.random()-0.5)*60,
      (Math.random()-0.5)*60
    );

    scene.add(mesh);

    nodes.push(mesh);
    velocity.push(new THREE.Vector3());
  });

  console.log("🧬 loaded:", data.title, data.nodes.length);
}

/* =========================
   BOOT
========================= */
async function start() {

  const kunstraum = await loadData("kunstraumeins.json");
  const handlungsraum = await loadData("handlungsraumeins.json");

  console.log("kunstraumeins:", kunstraum);
  console.log("handlungsraumeins:", handlungsraum);

  buildField(kunstraumeins, -30);
  buildField(handlungsraumeins, 30);

  animate();
}

start();

/* =========================
   LOOP
========================= */
function animate() {

  requestAnimationFrame(animate);

  core.rotation.y += 0.002;

  nodes.forEach((n,i)=>{

    const dir = new THREE.Vector3()
      .subVectors(core.position, n.position)
      .multiplyScalar(0.01);

    velocity[i].add(dir);
    velocity[i].multiplyScalar(0.92);

    n.position.add(velocity[i]);

    n.scale.setScalar(1 + Math.sin(Date.now()*0.002+i)*0.25);
  });

  renderer.render(scene,camera);
}

/* RESIZE */
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
