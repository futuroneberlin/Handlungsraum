<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FORMKUNST — SCULPTURAL HANDLUNGSRAUM</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { 
    margin: 0; 
    overflow: hidden; 
    background: #000000; 
    width: 100%; 
    height: 100%;
    font-family: 'Arial Black', 'Impact', sans-serif;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<script>
console.log("🪨 SCULPTURAL MATRIX ACTIVE — NO PERFECT SPHERES");

/* =========================
   1. SETUP & BILDHAUERISCHER RAUM
========================= */
const scene = new THREE.Scene();

// Tiefenwirkung im virtuellen Atelier maximieren
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 200;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* RADIKALES LICHT-SCHATTEN-FELD */
// Gedimmtes Raumlicht, gepaart mit einer aggressiven gelben Lichtquelle für extreme Kantenbetonung
const ambientLight = new THREE.AmbientLight(0x111111);
scene.add(ambientLight);

const industrialLight = new THREE.PointLight(0xffde00, 3, 500);
industrialLight.position.set(120, 150, 100);
scene.add(industrialLight);

const secondaryLight = new THREE.PointLight(0xffffff, 0.5, 300);
secondaryLight.position.set(-100, -100, 50);
scene.add(secondaryLight);

/* =========================
   2. DAS DATEN-MANIFEST (DEINE THEORIE)
========================= */
const concepts = [
  { text: "WIDERSTAND", size: 14 },
  { text: "FORMBARKEIT", size: 12 },
  { text: "VERÄNDERBARKEIT", size: 13 },
  { text: "KÖRPER", size: 15 },
  { text: "HANDLUNG", size: 14 },
  { text: "ZEIT", size: 11 },
  { text: "INTERAKTION", size: 12 },
  { text: "RESONANZ", size: 13 },
  { text: "KRAFT", size: 16 },
  { text: "VERMÖGEN", size: 12 },
  { text: "SOZIALE PLASTIK", size: 11 },
  { text: "UNTERBRECHUNG", size: 12 }
];

const nodes = [];
const velocity = [];
const mouse = new THREE.Vector3(0, 0, 0);

/* =========================
   3. GEOMETRIE-MEIẞELN: RAUHE STEINKÖRPER
========================= */
// Erzeugt unregelmäßige, unperfekte, bildhauerische Polyeder statt perfekter Kugeln
function createSculpturalMassGeometry(baseSize) {
  // Wir starten mit einem unregelmäßigen 20-Flächler (Ikosaeder)
  const geom = new THREE.IcosahedronGeometry(baseSize, 1); 
  
  // Mathematischer Meißel: Wir verformen die Eckpunkte (Vertices) zufällig, um Kanten und Brüche zu simulieren
  const pos = geom.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);
    
    // Perlin-ähnliches Rauschen simuliert Schläge auf das Gestein
    const noise = (Math.random() - 0.5) * (baseSize * 0.45);
    
    pos.setXYZ(
      i, 
      x + noise + Math.sin(y * 0.5) * 2, 
      y + noise, 
      z + noise + Math.cos(x * 0.5) * 2
    );
  }
  geom.computeVertexNormals(); // Berechnet die Kantenbeleuchtung neu für raue Oberflächen
  return geom;
}

/* =========================
   4. TEXT-MAPPING (TYPOGRAFIE AUF MATERIAL)
========================= */
// Generiert eine brutalistische, gelb-schwarze Textur im Arbeitsspeicher, die auf den Stein projiziert wird
function createContrastedTextTexture(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512;
  canvas.height = 128;
  
  // Tiefschwarzer Block als Materialbasis
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Roher, fetter Textüberzug in Warngelb
  ctx.fillStyle = '#FFDE00';
  ctx.font = 'bold 54px Arial, Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Text wird leicht verzerrt aufgetragen für handwerklichen Charakter
  ctx.setTransform(1, (Math.random()-0.5)*0.1, 0, 1, 0, 0);
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  
  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

/* =========================
   5. SKULPTUR SPRAWNEN (GENESE IM RAUM)
========================= */
function spawnSculptureNode(concept) {
  const geometry = createSculpturalMassGeometry(concept.size);
  const texture = createContrastedTextTexture(concept.text);
  
  // Das Material ist rauh, uneben und reagiert massiv auf das Licht im Raum
  const material = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.8,
    metalness: 0.2,
    bumpMap: texture, // Der Text gräbt sich reliefartig dreidimensional in den Stein ein
    bumpScale: 1.5
  });
  
  const mesh = new THREE.Mesh(geometry, material);
  
  // Verteilung im volumetrischen Handlungsraum
  mesh.position.set(
    (Math.random() - 0.5) * 180,
    (Math.random() - 0.5) * 120,
    (Math.random() - 0.5) * 100
  );
  
  // Individuelle Achsenneigung der Steine
  mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  
  mesh.userData = {
    rotationSpeed: {
      x: (Math.random() - 0.5) * 0.01,
      y: (Math.random() - 0.5) * 0.01
    },
    originalSize: concept.size,
    seed: Math.random() * 50
  };
  
  scene.add(mesh);
  nodes.push(mesh);
  velocity.push(new THREE.Vector3());
}

// Initialisiere die geformte Praxis
concepts.forEach(spawnSculptureNode);

/* =========================
   6. BILDHAUERISCHE SYSTEMDYNAMIK (FLUSS & REIBUNG)
========================= */
window.addEventListener("mousemove", (e) => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 140;
  mouse.y = -(e.clientY / window.innerHeight - 0.5) * 100;
});

function animate() {
  requestAnimationFrame(animate);
  const time = Date.now() * 0.001;
  
  // Die Hand des Betrachters formt das Gravitationsfeld
  const visitorTarget = new THREE.Vector3(mouse.x, mouse.y, 0);
  
  nodes.forEach((node, i) => {
    // Kraftfeld A: Sanfter Sog zum Nullpunkt des Ateliers
    let toCenter = new THREE.Vector3(0,0,0).sub(node.position).multiplyScalar(0.0015);
    
    // Kraftfeld B: Plastische Verschiebung durch Mausinteraktion
    let toVisitor = new THREE.Vector3().subVectors(visitorTarget, node.position);
    let distance = toVisitor.length();
    
    if(distance < 120) {
      // Je näher die Maus kommt, desto stärker wird das Material verdrängt oder angezogen (Viskosität)
      toVisitor.normalize().multiplyScalar((120 - distance) * 0.03);
    } else {
      toVisitor.set(0,0,0);
    }
    
    // Kraftfeld C: Inhärentes Zittern (Die Reibung im Vollzug)
    let jitter = new THREE.Vector3(
      Math.sin(time * 3 + i) * 0.15,
      Math.cos(time * 2.5 + i) * 0.15,
      0
    );
    
    velocity[i].add(toCenter);
    velocity[i].add(toVisitor);
    velocity[i].add(jitter);
    velocity[i].multiplyScalar(0.94); // Dämpfung durch Raumwiderstand
    
    node.position.add(velocity[i]);
    
    // Autonome langsame Rotation des Steinkörpers
    node.rotation.x += node.userData.rotationSpeed.x;
    node.rotation.y += node.userData.rotationSpeed.y;
    
    // KNET-EFFEKT: Organische Dehnung der Gesteinsmasse im Fluss
    const pulse = 1.0 + Math.sin(time * 1.5 + node.userData.seed) * 0.08;
    node.scale.set(pulse, pulse + (velocity[i].y * 0.05), pulse);
    
    // KOLLISIONS-WARNUNG: Bei starker Eigenbewegung fängt das Material an gelb aufzuglühen
    if(velocity[i].length() > 1.5) {
      node.material.emissive.setHex(0x332b00); // Inneres Glühen bei Reibung
    } else {
      node.material.emissive.setHex(0x000000);
    }
  });
  
  // Lichtquelle kreist dezent im Raum für wechselnde Schattenkanten auf den Texten
  industrialLight.position.x = Math.sin(time * 0.5) * 150;
  industrialLight.position.z = Math.cos(time * 0.5) * 150;
  
  renderer.render(scene, camera);
}

animate();

/* =========================
   7. ANPASSUNG AN FRONTEND-GRÖẞE
========================= */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
