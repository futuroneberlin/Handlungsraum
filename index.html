<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>handlungsraum | Digitale Textplastik</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #030303; 
            color: #ffffff; 
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }
        /* Radikales, minimalistisches Interface am Rand */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header h1 { 
            font-size: 24px; 
            font-weight: 300; 
            letter-spacing: 5px; 
            margin: 0; 
            color: #fff;
        }
        .header p { font-size: 11px; color: #666; margin: 5px 0 0 0; letter-spacing: 1px; }
        
        .legend {
            display: flex;
            gap: 20px;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot.erdung { background: #ffffff; }
        .dot.wasserfall { background: #00aaff; }
        .dot.feuer { background: #ff4400; }
        .dot.wirbelwind { background: #ff00aa; }

        .instructions {
            font-size: 11px;
            color: #444;
            text-align: right;
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <h1>HANDLUNGSRAUM</h1>
            <p>Digitale Bildhauerei: Semantische Überschneidungen & Kinetische Sätze</p>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div class="legend">
                <div class="legend-item"><span class="dot erdung"></span> Erdung (Theorie-Anker)</div>
                <div class="legend-item"><span class="dot wasserfall"></span> Wasserfall (Prozess-Fluss)</div>
                <div class="legend-item"><span class="dot feuer"></span> Feuer (Transformation)</div>
                <div class="legend-item"><span class="dot wirbelwind"></span> Wirbelwind (Ambiguität)</div>
            </div>
            <div class="instructions">
                [ Maus bewegen verändert Perspektive und Raum-Überlappung ]
            </div>
        </div>
    </div>

    <canvas id="sculptureCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sculptureCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };
        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        // Strukturierte Daten direkt aus deinen Dokumenten (Kunst.pdf & Konzeptpapier.pdf)
        // Die Verbindungen (Overlaps) werden über IDs gecodet
        const nodesData = [
            // RAUM 1: SOZIALE PLASTIK
            { id: "s1", type: "statement", text: "Wenn Bildhauerei die Gestaltung von Form, Raum und Beziehung ist, dann ist ein sozialer Raum eine Form der Bildhauerei.", element: "erdung", x: 0.2, y: 0.25, z: 100, overlaps: ["s2", "s3", "m1"] },
            { id: "s2", type: "schlagwort", text: "SOZIALE PLASTIK", element: "erdung", x: 0.25, y: 0.15, z: 150, overlaps: ["s1", "m5"] },
            { id: "s3", type: "statement", text: "Der Künstler arbeitet nicht am Stein, sondern am sozialen Gefüge. Jede Interaktion ist ein Schlag des Meißels.", element: "erdung", x: 0.15, y: 0.35, z: 80, overlaps: ["s1", "m1"] },

            // RAUM 2: PROZESS VOR RESULTAT
            { id: "p1", type: "statement", text: "Der Wert entsteht nicht erst im Ergebnis, sondern im Prozess selbst – im gemeinsamen Handeln, im Experiment.", element: "wasserfall", x: 0.5, y: 0.1, z: 200, overlaps: ["p2", "p3", "m3"] },
            { id: "p2", type: "schlagwort", text: "RESONANZ STATT RESSOURCE", element: "wasserfall", x: 0.48, y: 0.3, z: 120, overlaps: ["p1", "s1"] }, // Überlappung mit Raum 1
            { id: "p3", type: "statement", text: "Sicherer Experimentierraum (50%): Höchstes Bedürfnis ist die Freiheit von Bewertung.", element: "wasserfall", x: 0.55, y: 0.45, z: 50, overlaps: ["p1", "p2"] },

            // RAUM 3: TRANSFORMATION & HANDLUNG
            { id: "t1", type: "statement", text: "Bildende Kunst ist die Beherrschung der ästhetischen Praxis als Werkzeug für soziale Transformation.", element: "feuer", x: 0.8, y: 0.7, z: 90, overlaps: ["t2", "t3", "m1"] },
            { id: "t2", type: "schlagwort", text: "SOZIALE INFRASTRUKTUR", element: "feuer", x: 0.75, y: 0.85, z: 160, overlaps: ["t1", "p2"] }, // Überlappung mit Raum 2
            { id: "t3", type: "statement", text: "Körper, Handlung, Zeit, Interaktion: Die vier erweiterten bildhauerischen Eigenschaften.", element: "feuer", x: 0.85, y: 0.55, z: 110, overlaps: ["t1", "s1"] }, // Überlappung mit Raum 1

            // RAUM 4: URSPRÜNGLICHE KRAFT
            { id: "k1", type: "statement", text: "Die Unterscheidung zwischen 'Kraft' (intrinsisch) und 'Vermögen' (sozial geformt). Kunst muss freibleiben von Standards.", element: "wirbelwind", x: 0.5, y: 0.75, z: 130, overlaps: ["k2", "p3"] },
            { id: "k2", type: "schlagwort", text: "RAUM FÜR AMBIGUITÄT", element: "wirbelwind", x: 0.45, y: 0.85, z: 70, overlaps: ["k1", "t3"] },

            // RAUM 5: MANIFESTATION / FLUCHTLINGSUNTERKUNFT
            { id: "m1", type: "statement", text: "Concrete Case: Das Offene Atelier in der Flüchtlingsunterkunft. Aktivierung ohne Erwartung von Leistung.", element: "erdung", x: 0.2, y: 0.7, z: 140, overlaps: ["m2", "s3", "t1"] },
            { id: "m2", type: "schlagwort", text: "FUTUR ONE: COLLABORATIVE PRAXIS", element: "erdung", x: 0.15, y: 0.8, z: 180, overlaps: ["m1", "p2"] },
            { id: "m3", type: "statement", text: "Flüchtlingsunterkünfte sind stark klassifizierte Räume. Die Transformation wird hier konkret.", element: "erdung", x: 0.3, y: 0.6, z: 100, overlaps: ["m1", "k2"] }
        ];

        class TextNode {
            constructor(data) {
                this.id = data.id;
                this.type = data.type;
                this.text = data.text;
                this.element = data.element;
                this.overlaps = data.overlaps;
                
                // Absolute 3D-Basiskoordinaten im Raum (Prozentual skaliert)
                this.biasX = data.x;
                this.biasY = data.y;
                this.baseZ = data.z;

                this.x = 0;
                this.y = 0;
                this.z = this.baseZ;

                // Individuelle Dynamik-Offsets für die Animation
                this.offsetX = 0;
                this.offsetY = 0;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0.01 + Math.random() * 0.02;
            }

            update(time, mouseX, mouseY) {
                this.angle += this.speed;

                // 1. ANWENDUNG DER UX-NATURKRÄFTE ALS KINETISCHE BEWEGUNG
                if (this.element === 'erdung') {
                    // Träges, stabiles Atmen im Raum
                    this.offsetX = Math.cos(this.angle) * 10;
                    this.offsetY = Math.sin(this.angle) * 5;
                } 
                else if (this.element === 'wasserfall') {
                    // Kontinuierliches, vertikales Fließen mit Reset-Loop
                    this.offsetY = (this.offsetY + 1.2) % (height * 0.4);
                    this.offsetX = Math.sin(this.angle * 2) * 8;
                } 
                else if (this.element === 'feuer') {
                    // Schnelles, züngelndes, nervöses Aufsteigen
                    this.offsetY = -((time * 0.05 + this.baseZ) % 150);
                    this.offsetX = Math.sin(this.angle * 4) * 15;
                } 
                else if (this.element === 'wirbelwind') {
                    // Chaotische, orbitale Kreisbahnen um den Ursprungspunkt
                    this.offsetX = Math.cos(this.angle * 3) * 40;
                    this.offsetY = Math.sin(this.angle * 2) * 40;
                }

                // 2. 3D-ZENTRALPERSPEKTIVE & PARALLAXE (Durch Maus-Interaktion erzeugt)
                // Berechne die absolute Position auf dem Bildschirm
                const targetX = this.biasX * width + this.offsetX;
                const targetY = this.biasY * height + this.offsetY;

                // Verschiebung basierend auf Mausbewegung (Tiefe simuliert Formveränderung im Raum)
                const depthFactor = (200 - this.z) * 0.003;
                const parallaxX = (mouseX - width / 2) * depthFactor;
                const parallaxY = (mouseY - height / 2) * depthFactor;

                this.x = targetX + parallaxX;
                this.y = targetY + parallaxY;
            }

            draw() {
                ctx.save();
                
                // Skalierung und Helligkeit basierend auf virtueller Tiefe Z
                const scale = Math.max(0.4, (250 - this.z) / 200);
                ctx.translate(this.x, this.y);
                ctx.scale(scale, scale);

                // Typografie-Hierarchie für Statements vs Schlagworte
                if (this.type === 'schlagwort') {
                    ctx.font = "bold 16px 'Courier New', monospace";
                    ctx.letterSpacing = "4px";
                } else {
                    ctx.font = "12px 'Courier New', monospace";
                    ctx.letterSpacing = "0px";
                }

                // Farb-Materialisierung je nach Naturkraft
                let alpha = Math.max(0.15, scale - 0.2);
                if (this.element === 'erdung') ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                if (this.element === 'wasserfall') ctx.fillStyle = `rgba(0, 170, 255, ${alpha})`;
                if (this.element === 'feuer') ctx.fillStyle = `rgba(255, 70, 0, ${alpha})`;
                if (this.element === 'wirbelwind') ctx.fillStyle = `rgba(255, 0, 170, ${alpha})`;

                // Textausrichtung & Umbruch-Verhinderung im unendlichen Raum
                ctx.textAlign = "center";
                
                // Textbox-Effekt für lange Statements, damit sie lesbare Blöcke bilden
                if (this.type === 'statement') {
                    this.wrapText(this.text, 0, 0, 280, 16);
                } else {
                    ctx.fillText(`[ ${this.text} ]`, 0, 0);
                }

                ctx.restore();
            }

            wrapText(text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '';
                let currentY = y;

                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line, x, currentY);
                        line = words[n] + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, currentY);
            }
        }

        // Instanziierung aller Knoten
        const nodes = nodesData.map(data => new TextNode(data));

        // Funktion zum Zeichnen der sichtbaren konzeptionellen Überschneidungen
        function drawOverlaps() {
            ctx.lineWidth = 1;
            
            nodes.forEach(node => {
                node.overlaps.forEach(targetId => {
                    const targetNode = nodes.find(n => n.id === targetId);
                    if (targetNode) {
                        // Abstand berechnen für dynamische Transparenz
                        const dist = Math.hypot(node.x - targetNode.x, node.y - targetNode.y);
                        
                        // Je näher sich die Textblöcke im Raum kommen (durch Mausbewegung), umso stärker leuchtet das Netz
                        let alpha = Math.max(0, 0.25 - (dist / (width * 0.6)));
                        
                        if (alpha > 0) {
                            // Erzeuge einen Farbverlauf auf der Kante zwischen den Elementen
                            let gradient = ctx.createLinearGradient(node.x, node.y, targetNode.x, targetNode.y);
                            gradient.addColorStop(0, getElementColor(node.element, alpha));
                            gradient.addColorStop(1, getElementColor(targetNode.element, alpha));
                            
                            ctx.strokeStyle = gradient;
                            ctx.beginPath();
                            ctx.moveTo(node.x, node.y);
                            ctx.lineTo(targetNode.x, targetNode.y);
                            ctx.stroke();
                        }
                    }
                });
            });
        }

        function getElementColor(element, alpha) {
            if (element === 'erdung') return `rgba(255, 255, 255, ${alpha * 0.4})`;
            if (element === 'wasserfall') return `rgba(0, 170, 255, ${alpha})`;
            if (element === 'feuer') return `rgba(255, 70, 0, ${alpha})`;
            if (element === 'wirbelwind') return `rgba(255, 0, 170, ${alpha})`;
        }

        // Kinetischer Haupt-Loop
        let lastTime = 0;
        function loop(time) {
            // Bildhauerischer Bewegungsschleier statt hartem Clear
            ctx.fillStyle = 'rgba(3, 3, 3, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            // Dämpfung für weiche Maus-Perspektive
            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            // Zuerst das dreidimensionale Beziehungsnetzwerk zeichnen
            drawOverlaps();

            // Dann die schwebenden Text-Körper updaten und drüberlegen
            nodes.forEach(node => {
                node.update(time, mouse.x, mouse.y);
                node.draw();
            });

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
