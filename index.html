<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Theory Field Installation Engine</title>

<style>
  body { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }

  .label {
    position:absolute;
    color:white;
    font-family: monospace;
    font-size:12px;
    pointer-events:none;
    opacity:0.8;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<script>
console.log("🟣 THEORY FIELD ENGINE ONLINE");

/* =========================
   SCENE
========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75, innerWidth/innerHeight, 0.1, 1000
);
camera.position.z = 160;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.PointLight(0xffffff, 2));

/* CORE */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(8,32,32),
  new THREE.MeshBasicMaterial({ color:0xff00ff })
);
scene.add(core);

/* =========================
   THEORY DATA (YOUR TEXT STRUCTURE)
========================= */

const concepts = [
  { text:"Instrumentalisierung", group:"control" },
  { text:"Normative Standards", group:"control" },
  { text:"Bewertung", group:"control" },

  { text:"Potenzial", group:"force" },
  { text:"Kraft", group:"force" },
  { text:"Vermögen", group:"force" },

  { text:"Transformation", group:"process" },
  { text:"Resonanz", group:"process" },
  { text:"Erfahrung", group:"process" },

  { text:"Handlungsraum", group:"space" },
  { text:"Interaktion", group:"space" },
  { text:"Kollektiv", group:"space" },

  { text:"Bildhauerei", group:"form" },
  { text:"Form", group:"form" },
  { text:"Struktur", group:"form" }
];

/* =========================
   COLORS PER GROUP
========================= */
const colors = {
  control: 0xff3355,
  force: 0x33ff99,
  process: 0x3399ff,
  space: 0xffcc33,
  form: 0xaa66ff
};

/* =========================
   STATE
========================= */
const nodes = [];
const velocity = [];
const labels = [];

/* =========================
   CREATE NODES (NOT JUST BALLS → TEXT OBJECTS)
========================= */
function createLabel(text) {
  const div = document.createElement("div");
  div.className = "label";
  div.innerText = text;
  document.body.appendChild(div);
  return div;
}

concepts.forEach((c,i)=>{

  const geo = new THREE.SphereGeometry(2.2, 16, 16);
  const mat = new THREE.MeshBasicMaterial({
    color: colors[c.group]
  });

  const mesh = new THREE.Mesh(geo,mat);

  mesh.position.set(
    (Math.random()-0.5)*120,
    (Math.random()-0.5)*80,
    (Math.random()-0.5)*80
  );

  mesh.userData = c;

  scene.add(mesh);
  nodes.push(mesh);
  velocity.push(new THREE.Vector3());

  labels.push(createLabel(c.text));
});

/* =========================
   CONNECTIONS (SEMANTIC GRAPH)
========================= */
const linesMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
let lines = new THREE.Group();
scene.add(lines);

function updateConnections(){

  scene.remove(lines);
  lines = new THREE.Group();

  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){

      if(nodes[i].userData.group === nodes[j].userData.group){

        const geometry = new THREE.BufferGeometry().setFromPoints([
          nodes[i].position,
          nodes[j].position
        ]);

        const line = new THREE.Line(geometry, linesMaterial);
        lines.add(line);
      }
    }
  }

  scene.add(lines);
}

/* =========================
   ANIMATION
========================= */
function animate(){

  requestAnimationFrame(animate);

  core.rotation.y += 0.01;

  nodes.forEach((n,i)=>{

    const dir = new THREE.Vector3()
      .subVectors(core.position,n.position)
      .multiplyScalar(0.01);

    velocity[i].add(dir);
    velocity[i].multiplyScalar(0.92);

    n.position.add(velocity[i]);

    n.scale.setScalar(
      1 + Math.sin(Date.now()*0.002 + i)*0.25
    );

    /* HTML LABEL POSITION */
    const vector = n.position.clone().project(camera);

    labels[i].style.transform =
      `translate(${(vector.x*0.5+0.5)*innerWidth}px,
                  ${(-vector.y*0.5+0.5)*innerHeight}px)`;
  });

  updateConnections();

  renderer.render(scene,camera);
}

animate();

/* =========================
   RESIZE
========================= */
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
