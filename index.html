<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>handlungsraum | Endlose Textarchitektur</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #030303; 
            color: #ffffff; 
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 300; 
            letter-spacing: 6px; 
            margin: 0; 
            color: #ffffff;
        }
        .header p { font-size: 11px; color: #555; margin: 5px 0 0 0; letter-spacing: 1px; }
        
        .legend {
            display: flex;
            gap: 24px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #666;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot.erdung { background: #ffffff; }
        .dot.wasserfall { background: #0088ff; }
        .dot.feuer { background: #ff3300; }
        .dot.wirbelwind { background: #ff00aa; }

        .instructions {
            font-size: 10px;
            color: #555;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <h1>HANDLUNGSRAUM</h1>
            <p>Bildhauerische Betrachtungsmethodik: Eine Verwebung von Kunst & Sozialstruktur</p>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div class="legend">
                <div class="legend-item"><span class="dot erdung"></span> Erdung (Theorie-Anker)</div>
                <div class="legend-item"><span class="dot wasserfall"></span> Wasserfall (Träger Fluss)</div>
                <div class="legend-item"><span class="dot feuer"></span> Feuer (Transformation)</div>
                <div class="legend-item"><span class="dot wirbelwind"></span> Wirbelwind (Offene Ambiguität)</div>
            </div>
            <div class="instructions">
                [ Perspektive wandert träge mit der Maus ]
            </div>
        </div>
    </div>

    <canvas id="sculptureCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sculptureCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Sanfte Kameradämpfung (Interpolation) für extrem flüssige und langsame Bewegung
        let view = { x: 0, y: 0, targetX: 0, targetY: 0 };
        window.addEventListener('mousemove', (e) => {
            // Normierte Mauskoordinaten (-1 bis 1)
            view.targetX = (e.clientX - width / 2) / (width / 2);
            view.targetY = (e.clientY - height / 2) / (height / 2);
        });

        // Strukturierte Text-Körper (Direkt aus deinen Original-Auszügen verdichtet)
        const nodesData = [
            // SYSTEM / THEORIE (Anker)
            { id: "s1", type: "statement", text: "Wenn Bildhauerei die Gestaltung von Form, Raum und Beziehung ist, dann kann auch ein sozialer Raum eine Form der Bildhauerei sein.", element: "erdung", x: -250, y: -180, z: 50, overlaps: ["s2", "s3", "m1", "p2"] },
            { id: "s2", type: "schlagwort", text: "SOZIALE PLASTIK", element: "erdung", x: -250, y: -260, z: 20, overlaps: ["s1", "m2"] },
            { id: "s3", type: "statement", text: "Der Künstler arbeitet nicht am Stein, sondern am sozialen Gefüge. Jede Interaktion ist ein Meißelschlag.", element: "erdung", x: -380, y: -60, z: 80, overlaps: ["s1", "m1"] },

            // PROZESS / WIDERSTAND (Wasserfall - Träges Absinken)
            { id: "p1", type: "statement", text: "Der Wert entsteht nicht erst im Ergebnis, sondern im Prozess selbst – im gemeinsamen Handeln, im Experiment, im Dialog.", element: "wasserfall", x: 250, y: -200, z: 40, overlaps: ["p2", "p3", "s1"] },
            { id: "p2", type: "schlagwort", text: "RESONANZ STATT RESSOURCE", element: "wasserfall", x: 250, y: -120, z: 10, overlaps: ["p1", "p3", "m2"] },
            { id: "p3", type: "statement", text: "Sicherer Experimentierraum (50%): Das höchste Bedürfnis der Akteure im Raum ist die absolute Freiheit von Bewertung.", element: "wasserfall", x: 380, y: -280, z: 60, overlaps: ["p1", "k1"] },

            // TRANSFORMATION / KÖRPER (Feuer - Minimales Pulsieren nach oben)
            { id: "t1", type: "statement", text: "Beherrschung der ästhetischen Praxis als Werkzeug für soziale Transformation. Kunst ist notwendige soziale Infrastruktur, kein Luxusgut.", element: "feuer", x: 300, y: 150, z: 30, overlaps: ["t2", "t3", "m1"] },
            { id: "t2", type: "schlagwort", text: "KÖRPER . HANDLUNG . ZEIT . INTERAKTION", element: "feuer", x: 100, y: 250, z: 0, overlaps: ["t1", "s3"] },
            { id: "t3", type: "statement", text: "Migration ist gesellschaftlich reglementiert; das offene Atelier wird zur bewussten Aktivierung der psychischen Integrität.", element: "feuer", x: 420, y: 50, z: 70, overlaps: ["t1", "m3"] },

            // AMBIGUITÄT / KRAFT (Wirbelwind - Weite, langsame Umlaufbahn)
            { id: "k1", type: "statement", text: "Die Unterscheidung zwischen 'Kraft' (intrinsisch) und 'Vermögen' (sozial geformt). Kunst muss ein freier Raum der ursprünglichen Kraft bleiben.", element: "wirbelwind", x: -200, y: 200, z: 60, overlaps: ["k2", "p1"] },
            { id: "k2", type: "schlagwort", text: "RAUM FÜR AMBIGUITÄT", element: "wirbelwind", x: -150, y: 120, z: 15, overlaps: ["k1", "t2"] },

            // DER KONKRETE FALL (Anker unten links)
            { id: "m1", type: "statement", text: "Concrete Case: Das Offene Atelier in der Flüchtlingsunterkunft. Freiwillige Teilnahme, kein festgelegtes Ergebnis.", element: "erdung", x: -400, y: 50, z: 20, overlaps: ["m2", "m3", "s1"] },
            { id: "m2", type: "schlagwort", text: "FUTUR ONE: COLLABORATIVE PRAXIS", element: "erdung", x: -450, y: 140, z: -10, overlaps: ["m1", "p2"] },
            { id: "m3", type: "statement", text: "Institutionalized visibility is a curated past, masquerading as the present. The process eludes this. It cannot be archived.", element: "erdung", x: -100, y: 20, z: 90, overlaps: ["m1", "t1", "k1"] }
        ];

        class TextSpaceNode {
            constructor(data) {
                this.id = data.id;
                this.type = data.type;
                this.text = data.text;
                this.element = data.element;
                this.overlaps = data.overlaps;
                
                // Fixierte 3D-Koordinaten im virtuellen Raum (Zentrum = 0,0)
                this.localX = data.x;
                this.localY = data.y;
                this.localZ = data.z;

                // Kinetischer Speicher für die extrem langsame Bewegung
                this.animX = 0;
                this.animY = 0;
                this.angle = Math.random() * Math.PI * 2;
                // Extrem verlangsamte Frequenz
                this.speed = 0.0015 + Math.random() * 0.001; 
            }

            update(time) {
                this.angle += this.speed;

                // NATURGEGEBENHEITEN ALS SUBTILE, LESBARE BEWEGUNG (ENDLOSER ZYKLUS)
                if (this.element === 'erdung') {
                    // Fast statisch, atmet nur minimal im Raum
                    this.animX = Math.cos(this.angle) * 4;
                    this.animY = Math.sin(this.angle) * 3;
                } 
                else if (this.element === 'wasserfall') {
                    // Sinkt extrem langsam ab und fängt oben sanft wieder an
                    this.animY = (time * 0.015 + this.localY + 400) % 600 - 300;
                    this.animX = Math.sin(this.angle) * 5;
                } 
                else if (this.element === 'feuer') {
                    // Steigt wie eine langsame Hitzewelle nach oben und looped endlos
                    this.animY = -((time * 0.02 + (-this.localY) + 400) % 600) + 300;
                    this.animX = Math.cos(this.angle * 2) * 6;
                } 
                else if (this.element === 'wirbelwind') {
                    // Driftet in einem sehr weiten, lesbaren Kreisradius
                    this.animX = Math.cos(this.angle * 0.4) * 25;
                    this.animY = Math.sin(this.angle * 0.4) * 15;
                }
            }

            // Berechnet die tatsächliche Position auf dem Screen inklusive 3D-Parallaxe
            getScreenCoords() {
                const centerX = width / 2;
                const centerY = height / 2;

                // Statische Basis + die langsame Animation
                let curX = this.localX + (this.element !== 'wasserfall' && this.element !== 'feuer' ? this.animX : this.animX);
                let curY = (this.element === 'wasserfall' || this.element === 'feuer') ? this.animY : this.localY + this.animY;
                
                // 3D-Tiefenberechnung gesteuert durch die träge Kameraperspektive (Maus)
                // Je höher Z, desto stärker reagiert das Wort auf den Blickwinkel
                const parallaxX = view.x * this.localZ * -1.2;
                const parallaxY = view.y * this.localZ * -1.2;

                return {
                    x: centerX + curX + parallaxX,
                    y: centerY + curY + parallaxY,
                    zFactor: (300 - this.localZ) / 300 // Skalierungsfaktor für Optik
                };
            }

            draw(coords) {
                ctx.save();
                ctx.translate(coords.x, coords.y);
                ctx.scale(coords.zFactor, coords.zFactor);

                // Typografische Hierarchie für gl
