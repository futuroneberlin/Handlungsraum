<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handlungsraum — Dynamik der Interaktion</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="space" id="space">
      <section class="headline">
        <h2>FORM</h2>
        <h1>DYNAMIK DER INTERAKTION</h1>
        <h2>RAUM</h2>
      </section>

      <section class="equation-row">
        <span>ästhetische Aktivität</span>
        <span class="equals" aria-hidden="true"></span>
        <span>Form ist</span>
        <span class="equals" aria-hidden="true"></span>
        <span>Erfahrung ist</span>
        <span class="equals" aria-hidden="true"></span>
        <span>Objekt</span>
      </section>

      <section class="cards">
        <article class="card left">
          <p>Rezipient</p>
          <p>Partizipant</p>
        </article>
        <article class="card center-left">
          <p>Moment</p>
          <p>Handlung</p>
        </article>
        <p class="mid-label">Form</p>
        <article class="card center-right">
          <p>Entwicklung</p>
        </article>
        <article class="card right">
          <p>Interaktion</p>
        </article>
      </section>

      <footer>UMWELT = Multidimensionale Kollaboration</footer>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
