<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Handlungsraum – Stable Field Mode</title>

<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
</style>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

</head>

<body>

<script>
console.log("🧠 FIELD MODE START");

/* =========================
   BASIC SETUP
========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 80;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT (optional but stable) */
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(50, 50, 50);
scene.add(light);

/* CORE (THEORY CENTER) */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(6, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xff00ff })
);
scene.add(core);

/* =========================
   SYSTEM STATE
========================= */
const nodes = [];
const velocity = [];

/* =========================
   FILES (YOUR REAL DATA)
========================= */
const FILES = [
  "handlungsraum.pdf",
  "kunstraum.pdf"
];

/* =========================
   BUILD NODES FROM FILES
   (NO PDF PARSING — STABLE MODE)
========================= */
function buildField(files) {

  files.forEach((name, i) => {

    // create visual object per PDF
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(3, 24, 24),
      new THREE.MeshBasicMaterial({
        color: i === 0 ? 0x00ffff : 0xffff00
      })
    );

    mesh.position.set(
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 50
    );

    mesh.userData = {
      file: name,
      type: "pdf_object"
    };

    scene.add(mesh);

    nodes.push(mesh);
    velocity.push(new THREE.Vector3());

    console.log("📄 node created:", name);
  });
}

/* =========================
   INIT
========================= */
function start() {

  buildField(FILES);

  animate();
}

start();

/* =========================
   ANIMATION (GRAVITY FIELD)
========================= */
function animate() {

  requestAnimationFrame(animate);

  core.rotation.y += 0.002;

  nodes.forEach((n, i) => {

    const dir = new THREE.Vector3()
      .subVectors(core.position, n.position)
      .multiplyScalar(0.01);

    velocity[i].add(dir);
    velocity[i].multiplyScalar(0.92);

    n.position.add(velocity[i]);

    n.scale.setScalar(
      1 + Math.sin(Date.now() * 0.002 + i) * 0.3
    );
  });

  renderer.render(scene, camera);
}

/* =========================
   RESIZE
========================= */
window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
