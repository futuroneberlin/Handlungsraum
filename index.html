<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Handlungsraum – Stable Museum Mode</title>

<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
</style>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- PDF.js (IMPORTANT: legacy build = GLOBAL pdfjsLib) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>

</head>

<body>

<script>
console.log("🧠 SYSTEM BOOT: MUSEUM MODE ACTIVE");

/* =========================
   PDF.JS SETUP (CRITICAL FIX)
========================= */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";

/* =========================
   THREE SETUP
========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 80;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(50, 50, 50);
scene.add(light);

/* CORE (THEORY CENTER) */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(6, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xff00ff })
);
scene.add(core);

/* STATE */
const nodes = [];
const velocity = [];

/* =========================
   PDF FILES (FIXED)
========================= */
const FILES = [
  "handlungsraum.pdf",
  "kunstraum.pdf",
  "konzeptpapier.pdf"
];

/* =========================
   SAFE PDF LOADER
========================= */
async function loadPDF(file) {

  try {
    const pdf = await pdfjsLib.getDocument("./pdf/" + file).promise;

    let chunks = [];

    for (let i = 1; i <= pdf.numPages; i++) {

      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      const text = content.items.map(i => i.str).join(" ");

      chunks.push(
        ...text.split(".")
          .map(t => t.trim())
          .filter(Boolean)
      );
    }

    console.log("📄 loaded:", file, "chunks:", chunks.length);
    return chunks;

  } catch (e) {

    console.warn("⚠️ fallback activated:", file);

    return [
      "semantic fallback node",
      "actional space active",
      "social sculpture mode",
      "system self-healing"
    ];
  }
}

/* =========================
   BUILD FIELD
========================= */
function buildField(data) {

  data.forEach((t, i) => {

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 10, 10),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color(`hsl(${Math.random()*360},100%,60%)`)
      })
    );

    mesh.position.set(
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60
    );

    scene.add(mesh);

    nodes.push(mesh);
    velocity.push(new THREE.Vector3());
  });

  console.log("🧬 field built:", nodes.length, "nodes");
}

/* =========================
   BOOTSTRAP (ZERO FAILURE)
========================= */
async function start() {

  let all = [];

  for (const f of FILES) {
    const chunks = await loadPDF(f);
    all.push(...chunks);
  }

  if (all.length === 0) {
    all = ["system auto-generated node"];
  }

  buildField(all);

  animate();
}

start();

/* =========================
   ANIMATION LOOP
========================= */
function animate() {

  requestAnimationFrame(animate);

  core.rotation.y += 0.002;

  nodes.forEach((n, i) => {

    const dir = new THREE.Vector3()
      .subVectors(core.position, n.position)
      .multiplyScalar(0.01);

    velocity[i].add(dir);
    velocity[i].multiplyScalar(0.92);

    n.position.add(velocity[i]);

    n.scale.setScalar(
      1 + Math.sin(Date.now()*0.002 + i) * 0.2
    );
  });

  renderer.render(scene, camera);
}

/* =========================
   RESIZE
========================= */
window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
