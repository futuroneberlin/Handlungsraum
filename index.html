<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Handlungsraum – Clean Field Mode</title>

<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
</style>

<!-- THREE.JS (OK, warning ignorierbar) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

</head>

<body>

<script>
console.log("🧠 CLEAN FIELD MODE ACTIVE");

/* =========================
   SCENE SETUP
========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 80;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(50, 50, 50);
scene.add(light);

/* CORE (CENTER THEORY NODE) */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(6, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xff00ff })
);
scene.add(core);

/* =========================
   STATE
========================= */
const nodes = [];
const velocity = [];

/* =========================
   YOUR PDF ENTITIES (NO PARSING)
========================= */
const FILES = [
  "handlungsraum.pdf",
  "kunstraum.pdf"
];

/* =========================
   BUILD FIELD (SAFE VERSION)
========================= */
function buildField() {

  FILES.forEach((file, i) => {

    // main node
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(4, 24, 24),
      new THREE.MeshBasicMaterial({
        color: i === 0 ? 0x00ffff : 0xffff00
      })
    );

    mesh.position.set(
      (i - 0.5) * 40,
      0,
      0
    );

    scene.add(mesh);
    nodes.push(mesh);
    velocity.push(new THREE.Vector3());

    // EXTRA: satellite nodes (IMPORTANT!)
    for (let j = 0; j < 8; j++) {

      const small = new THREE.Mesh(
        new THREE.SphereGeometry(1, 12, 12),
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        })
      );

      small.position.set(
        mesh.position.x + (Math.random() - 0.5) * 20,
        mesh.position.y + (Math.random() - 0.5) * 20,
        mesh.position.z + (Math.random() - 0.5) * 20
      );

      scene.add(small);
      nodes.push(small);
      velocity.push(new THREE.Vector3());
    }
  });

  console.log("🧬 expanded field nodes:", nodes.length);
}

/* =========================
   START
========================= */
buildField();
animate();

/* =========================
   LOOP
========================= */
function animate() {

  requestAnimationFrame(animate);

  core.rotation.y += 0.002;

  nodes.forEach((n, i) => {

    const dir = new THREE.Vector3()
      .subVectors(core.position, n.position)
      .multiplyScalar(0.01);

    velocity[i].add(dir);
    velocity[i].multiplyScalar(0.92);

    n.position.add(velocity[i]);

    n.scale.setScalar(
      1 + Math.sin(Date.now()*0.002 + i) * 0.3
    );
  });

  renderer.render(scene, camera);
}

/* =========================
   RESIZE
========================= */
window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
