<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HANDLUNGSRAUM - STANDALONE SCULPTURAL ENGINE</title>
<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #060606;
  font-family: 'Courier New', monospace;
}

canvas {
  display: block;
}

#overlay {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 20;
  width: min(360px, 84vw);
  color: #f8c95f;
  font-size: 12px;
  line-height: 1.45;
  letter-spacing: 0.08em;
  pointer-events: none;
  text-shadow: 0 0 10px rgba(248, 201, 95, 0.2);
}

#hud {
  position: absolute;
  right: 16px;
  top: 16px;
  z-index: 21;
  background: rgba(14, 14, 14, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  color: #dfdfdf;
  padding: 10px;
  width: min(280px, 86vw);
  backdrop-filter: blur(5px);
}

#hud .row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 6px;
}

#hud .buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

#hud button {
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
  color: #f0f0f0;
  padding: 6px;
  font-family: inherit;
}

#hud label {
  display: block;
  font-size: 11px;
  margin-bottom: 4px;
  color: #dfb467;
}

#hud input[type="range"] {
  width: 100%;
  margin-bottom: 8px;
}

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at center, transparent 5%, rgba(0, 0, 0, 0.65) 100%);
}

@media (max-width: 820px) {
  #hud {
    top: auto;
    bottom: 10px;
  }
}
</style>
</head>
<body>
<div id="overlay">
HANDLUNGSRAUM<br />
CONTINUOUS SCULPTURAL BUILD PROCESS<br /><br />
WORDS FLOW LIKE A TERMINAL WATERFALL<br />
TEXT BECOMES SPATIAL MATERIAL<br />
NO FINAL STATE - ONLY CONTINUOUS FORMATION
</div>

<div id="hud">
  <div class="buttons">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>
  <label for="speedRange">Prozess Tempo</label>
  <input id="speedRange" type="range" min="0.3" max="2.2" step="0.1" value="1" />
  <label for="densityRange">Wortstrom Dichte</label>
  <input id="densityRange" type="range" min="60" max="260" step="10" value="170" />
  <div class="row"><span>Aktive Woerter</span><span id="wordCount">0</span></div>
  <div class="row"><span>Mesh Fragmente</span><span id="blobCount">0</span></div>
  <div class="row"><span>Prozesszeit</span><span id="runtime">00:00</span></div>
</div>

<div class="vignette"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090909);
scene.fog = new THREE.FogExp2(0x050505, 0.0056);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 2600);
camera.position.set(0, 6, 182);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0x404040, 2.0);
scene.add(ambient);

const keyLight = new THREE.PointLight(0xffc966, 4.3, 1000);
keyLight.position.set(120, 150, 210);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x3f63d6, 2.2, 760);
fillLight.position.set(-130, -95, 170);
scene.add(fillLight);

const backLight = new THREE.PointLight(0xff6b2e, 2.0, 680);
backLight.position.set(-20, 80, -220);
scene.add(backLight);

function createGroundTexture() {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 1024;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#1b1a19');
  g.addColorStop(1, '#0f0f0f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 42000; i += 1) {
    const x = Math.random() * 1024;
    const y = Math.random() * 1024;
    const v = Math.floor(35 + Math.random() * 80);
    const a = Math.random() * 0.08;
    ctx.fillStyle = `rgba(${v},${v - 8},${v - 12},${a})`;
    ctx.fillRect(x, y, 2, 2);
  }

  ctx.strokeStyle = 'rgba(234, 182, 78, 0.45)';
  ctx.lineWidth = 18;
  ctx.beginPath();
  ctx.moveTo(40, 860);
  ctx.lineTo(980, 770);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  return tex;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400, 120, 120),
  new THREE.MeshStandardMaterial({
    map: createGroundTexture(),
    wireframe: false,
    roughness: 0.95,
    metalness: 0.05
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -126;
ground.receiveShadow = true;
scene.add(ground);

const wireGround = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000, 90, 90),
  new THREE.MeshBasicMaterial({ color: 0x2c2c2c, wireframe: true, transparent: true, opacity: 0.16 })
);
wireGround.rotation.x = -Math.PI / 2;
wireGround.position.y = -124;
scene.add(wireGround);

const scaffold = new THREE.Group();
scene.add(scaffold);

function beam(x, y, z, sx, sy, sz, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.18 })
  );
  m.position.set(x, y, z);
  m.castShadow = true;
  scaffold.add(m);
}

for (let i = 0; i < 7; i += 1) {
  const x = -180 + i * 62;
  beam(x, -30, -70, 3, 170, 3, 0x3f3f42);
  beam(x, 54, -70, 3, 3, 200, 0x55595f);
}

const dustGeo = new THREE.BufferGeometry();
const dustCount = 2200;
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i += 1) {
  dustPos[i * 3] = (Math.random() - 0.5) * 920;
  dustPos[i * 3 + 1] = Math.random() * 310 - 120;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 920;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(
  dustGeo,
  new THREE.PointsMaterial({ color: 0xaf9f86, size: 1.05, transparent: true, opacity: 0.24, depthWrite: false })
);
scene.add(dust);

const theory = `
HANDLUNGSRAUM
TRANSFORMATION
RESONANZ
SOZIALE PLASTIK
KRAFT
VERMOEGEN
INTERAKTION
ZEIT
WIDERSTAND
FORMBARKEIT
KOERPER
REIBUNG
PROCESS
COLLECTIVE
AESTHETIC ACTION
OPEN FIELD
EMERGENCE
SPATIAL MEMORY
ACTIONAL SPACE
SCULPTURAL FIELD
PARTICIPATION
RELATION
LEERE
VERDICHTUNG
`; 

const lexicon = theory.split(/\s+/).filter(Boolean);
const spriteCache = new Map();

function spriteTexture(text) {
  if (spriteCache.has(text)) {
    return spriteCache.get(text);
  }

  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(247, 198, 82, 0.4)';
  ctx.strokeRect(8, 10, canvas.width - 16, canvas.height - 20);
  ctx.font = 'bold 54px Arial';
  ctx.fillStyle = '#ffcc66';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 24, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  spriteCache.set(text, texture);
  return texture;
}

const streamSprites = [];

function spawnWordSprite() {
  const word = lexicon[Math.floor(Math.random() * lexicon.length)];
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: spriteTexture(word),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  sprite.scale.set(30 + word.length * 0.5, 8.2, 1);
  sprite.position.set(-260 + Math.random() * 24, 120 - Math.random() * 230, (Math.random() - 0.5) * 240);

  sprite.userData = {
    velocity: new THREE.Vector3(1.2 + Math.random() * 2.4, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.22),
    wobble: Math.random() * Math.PI * 2
  };

  scene.add(sprite);
  streamSprites.push(sprite);
}

const sculptureGroup = new THREE.Group();
scene.add(sculptureGroup);
const blobs = [];

function createBlob(x, y, z, size, tint = 0x272727) {
  const geo = new THREE.IcosahedronGeometry(size, 3);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i += 1) {
    const px = pos.getX(i);
    const py = pos.getY(i);
    const pz = pos.getZ(i);
    const noise = Math.sin(px * 0.32) + Math.cos(py * 0.28) + Math.sin(pz * 0.24);
    pos.setXYZ(i, px + noise * 1.7, py + noise * 1.5, pz + noise * 1.8);
  }
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: tint,
    roughness: 0.82,
    metalness: 0.12,
    emissive: 0x2d1d0e,
    emissiveIntensity: 0.65
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  sculptureGroup.add(mesh);
  blobs.push(mesh);
}

for (let i = 0; i < 22; i += 1) {
  createBlob(
    (Math.random() - 0.5) * 70,
    (Math.random() - 0.5) * 60,
    (Math.random() - 0.5) * 70,
    5 + Math.random() * 9,
    0x242424 + Math.floor(Math.random() * 0x101010)
  );
}

for (let i = 0; i < 170; i += 1) {
  spawnWordSprite();
}

const mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 230;
  mouse.y = -(e.clientY / window.innerHeight - 0.5) * 190;
});

const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const speedRange = document.getElementById('speedRange');
const densityRange = document.getElementById('densityRange');
const wordCount = document.getElementById('wordCount');
const blobCount = document.getElementById('blobCount');
const runtimeEl = document.getElementById('runtime');

const state = {
  paused: false,
  speed: 1,
  density: 170,
  runtime: 0
};

pauseBtn.addEventListener('click', () => {
  state.paused = !state.paused;
  pauseBtn.textContent = state.paused ? 'Weiter' : 'Pause';
});

resetBtn.addEventListener('click', () => {
  for (const s of streamSprites) {
    s.position.x = -260 + Math.random() * 24;
    s.position.y = 120 - Math.random() * 230;
    s.position.z = (Math.random() - 0.5) * 240;
  }
  for (const b of blobs) {
    b.scale.set(1, 1, 1);
    b.position.x *= 0.55;
    b.position.y *= 0.55;
    b.position.z *= 0.55;
  }
  state.runtime = 0;
});

speedRange.addEventListener('input', () => {
  state.speed = Number(speedRange.value);
});

densityRange.addEventListener('input', () => {
  const target = Number(densityRange.value);
  state.density = target;
  while (streamSprites.length < target) {
    spawnWordSprite();
  }
  while (streamSprites.length > target) {
    const sprite = streamSprites.pop();
    scene.remove(sprite);
    sprite.material.dispose();
  }
});

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === ' ') {
    e.preventDefault();
    pauseBtn.click();
  }
  if (key === 'r') {
    resetBtn.click();
  }
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (!state.paused) {
    const spd = state.speed;
    state.runtime += dt * spd;

    for (let i = 0; i < streamSprites.length; i += 1) {
      const s = streamSprites[i];
      const v = s.userData.velocity;
      s.position.x += v.x * spd;
      s.position.y += v.y * spd;
      s.position.z += v.z * spd;
      s.position.y += Math.sin(t * 2 + s.userData.wobble + i * 0.03) * 0.06;

      if (s.position.x > -16) {
        s.position.x = -260;
        s.position.y = 120 - Math.random() * 230;
        s.position.z = (Math.random() - 0.5) * 240;

        const b = blobs[Math.floor(Math.random() * blobs.length)];
        b.scale.x += 0.016 + Math.random() * 0.02;
        b.scale.y += 0.012 + Math.random() * 0.02;
        b.scale.z += 0.014 + Math.random() * 0.02;

        if (Math.random() < 0.09 && blobs.length < 110) {
          createBlob(
            b.position.x + (Math.random() - 0.5) * 18,
            b.position.y + (Math.random() - 0.5) * 18,
            b.position.z + (Math.random() - 0.5) * 18,
            3 + Math.random() * 5,
            0x2d2b28 + Math.floor(Math.random() * 0x141414)
          );
        }
      }
    }

    for (let i = 0; i < blobs.length; i += 1) {
      const b = blobs[i];
      b.rotation.x += 0.002 + i * 0.000004;
      b.rotation.y += 0.003 + i * 0.000005;

      const dx = mouse.x - b.position.x;
      const dy = mouse.y - b.position.y;
      b.position.x += dx * 0.00075 * spd;
      b.position.y += dy * 0.00075 * spd;
      b.position.z += Math.sin(t + i) * 0.02;

      const breath = 1 + Math.sin(t * 1.7 + i * 0.3) * 0.018;
      b.scale.multiplyScalar(0.9989);
      b.scale.x += breath * 0.0012;
      b.scale.y += breath * 0.0011;
      b.scale.z += breath * 0.0013;
    }

    const p = dust.geometry.getAttribute('position');
    const arr = p.array;
    for (let i = 0; i < dustCount; i += 1) {
      const idx = i * 3;
      arr[idx] += Math.sin(t * 0.3 + i) * 0.003;
      arr[idx + 1] -= 0.06 * spd;
      if (arr[idx + 1] < -130) {
        arr[idx + 1] = 190;
      }
    }
    p.needsUpdate = true;
  }

  scaffold.position.y = -4 + Math.sin(t * 0.45) * 0.9;
  keyLight.position.x = Math.sin(t * 0.5) * 170;
  camera.position.x = Math.sin(t * 0.2) * 44;
  camera.position.y = 8 + Math.cos(t * 0.35) * 7;
  camera.lookAt(0, 0, 0);

  wordCount.textContent = String(streamSprites.length);
  blobCount.textContent = String(blobs.length);
  const min = String(Math.floor(state.runtime / 60)).padStart(2, '0');
  const sec = String(Math.floor(state.runtime % 60)).padStart(2, '0');
  runtimeEl.textContent = `${min}:${sec}`;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
