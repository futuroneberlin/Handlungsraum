<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Installation Engine</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }
  canvas { display: block; }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<script>
console.log("🏛️ INSTALLATION ENGINE ONLINE");

/* =========================
   RUNTIME STATE
========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 90;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT (soft installation glow) */
const light = new THREE.PointLight(0xffffff, 1.5);
light.position.set(50, 50, 50);
scene.add(light);

/* CORE SYSTEM NODE */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(7, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xff00ff })
);
scene.add(core);

/* STATE */
let nodes = [];
let velocity = [];

/* =========================
   DATA LOADER (JSON ONLY)
========================= */
async function loadData(file) {
  const res = await fetch("./data/" + file);
  return await res.json();
}

/* =========================
   FIELD BUILDER (SEMANTIC SPACE)
========================= */
function buildField(data, offsetX) {

  data.nodes.forEach((word, i) => {

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 16, 16),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(`hsl(${Math.random()*360},100%,60%)`)
      })
    );

    mesh.position.set(
      offsetX + (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 50
    );

    mesh.userData = {
      text: word,
      group: data.title
    };

    scene.add(mesh);

    nodes.push(mesh);
    velocity.push(new THREE.Vector3());
  });

  console.log("🧬 loaded group:", data.title);
}

/* =========================
   BOOT SEQUENCE
========================= */
async function start() {

  const kunstraumeins = await loadData("kunstraum.json");
  const handlungsraumeins = await loadData("handlungsraum.json");

  buildField(kunstraumeins, -30);
  buildField(handlungsraumeins, 30);

  animate();
}

start();

/* =========================
   GRAVITY ENGINE
========================= */
function animate() {

  requestAnimationFrame(animate);

  core.rotation.y += 0.002;

  nodes.forEach((n, i) => {

    // attraction to core
    const dir = new THREE.Vector3()
      .subVectors(core.position, n.position)
      .multiplyScalar(0.01);

    velocity[i].add(dir);
    velocity[i].multiplyScalar(0.92);

    n.position.add(velocity[i]);

    // breathing system
    n.scale.setScalar(
      1 + Math.sin(Date.now()*0.002 + i) * 0.25
    );
  });

  renderer.render(scene, camera);
}

/* =========================
   RESIZE
========================= */
window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
