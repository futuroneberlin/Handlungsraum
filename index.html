<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>HANDLUNGSRAUM — EXHIBITION AI REVOLUTION</title>

<style>
html, body{
  margin:0;
  padding:0;
  overflow:hidden;
  width:100%;
  height:100%;
  background:#000;
  font-family:Arial, Helvetica, sans-serif;
}

/* THREE CANVAS */
canvas{
  display:block;
  position:fixed;
  inset:0;
  z-index:1;
}

/* LIVE BAUSTELLE */
#bgVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0.18;
  filter:contrast(1.2) saturate(0) brightness(0.45);
  z-index:0;
}

/* NOISE */
#noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
  opacity:.08;
  background-image:url("https://grainy-gradients.vercel.app/noise.svg");
  mix-blend-mode:screen;
}

/* WORD STREAM */
.word{
  position:absolute;
  color:#ffe600;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
  pointer-events:none;
  user-select:none;
  letter-spacing:2px;
  mix-blend-mode:screen;
  text-shadow:
    0 0 10px rgba(255,230,0,.7),
    0 0 20px rgba(255,230,0,.5);
  transition:transform .15s linear;
  z-index:3;
}

/* TITLE */
#title{
  position:fixed;
  top:20px;
  left:20px;
  color:#fff;
  z-index:10;
  font-size:14px;
  letter-spacing:4px;
  line-height:1.6;
  opacity:.8;
}

/* SCANNER */
#scan{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:6;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.02) 0px,
      rgba(255,255,255,.02) 2px,
      transparent 2px,
      transparent 4px
    );
  animation:scan 8s linear infinite;
}

@keyframes scan{
  from{transform:translateY(-50px);}
  to{transform:translateY(50px);}
}
</style>
</head>

<body>

<!-- PLATTENBAU / BAUSTELLE VIDEO -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="https://cdn.coverr.co/videos/coverr-construction-site-1567845725402?download=1080p" type="video/mp4">
</video>

<div id="noise"></div>
<div id="scan"></div>

<div id="title">
HANDLUNGSRAUM ÆSTHETIC PRACTICE<br>
VISITOR = FORCE FIELD<br>
TEXT = MATERIAL<br>
SPACE = SOCIAL SCULPTURE
</div>

<script type="module">

/* =========================
   IMPORT MODERN THREE
========================= */
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

console.log("🧠 HANDLUNGSRAUM ENGINE ONLINE");

/* =========================
   MASSIVE TEXT SOURCE
========================= */

const theoryText = `

THE HANDLUNGSRAUM OF AESTHETIC PRACTICE

The artwork loses fixed object identity and dissolves into a living process.
Transformation.
Resistance.
Resonance instead of result.
Social sculpture.
The visitor becomes force.
The room becomes body.
The sculpture becomes relation.

FROM VOLUME TO ACTION.
FROM OBJECT TO TIME.
FROM MATERIAL TO EXPERIENCE.
FROM OBSERVER TO PARTICIPANT.

KRAFT.
VERMÖGEN.
INTERAKTION.
REIBUNG.
WIDERSTAND.
FORMBARKEIT.
VERÄNDERBARKEIT.
ZEIT.
KÖRPER.
HANDLUNG.
SOZIALE INFRASTRUKTUR.
PROCESS.
BECOMING.
OPEN SYSTEM.
NON STANDARDIZATION.
UNFINISHED FUTURE.
COLLECTIVE TENSION.
MOVEMENT.
DISRUPTION.
FIELD.
ENERGY.
TRANSFORMATION.

The handlungsraum is not an archive.
It is not a product.
It is not an institution.
It is an unstable atmospheric field.

Visitors deform the semantic structure through movement.
Language collapses and rebuilds itself.
Words become architecture.
Architecture becomes noise.
Noise becomes sculpture.

`;

const WORDS = theoryText
  .split(/\s+/)
  .filter(w => w.length > 2);

/* =========================
   THREE SCENE
========================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  3000
);

camera.position.z = 220;

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT
========================= */

const ambient = new THREE.AmbientLight(0x404040, 1.4);
scene.add(ambient);

const lightA = new THREE.PointLight(0xffdd00, 10, 1200);
lightA.position.set(300,200,200);
scene.add(lightA);

const lightB = new THREE.PointLight(0xff2200, 6, 1200);
lightB.position.set(-200,-100,100);
scene.add(lightB);

/* =========================
   VISITOR FORCE
========================= */

const mouse = new THREE.Vector2();

window.addEventListener("mousemove", e => {

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

});

/* =========================
   SCULPTURAL PARTICLES
========================= */

const particles = [];
const velocities = [];

function createChaosGeometry(size){

  const geo = new THREE.IcosahedronGeometry(size, 4);

  const pos = geo.attributes.position;

  for(let i=0;i<pos.count;i++){

    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);

    const noise =
      Math.sin(x*0.3) * 4 +
      Math.cos(y*0.4) * 4 +
      (Math.random()-0.5) * 8;

    pos.setXYZ(
      i,
      x + noise,
      y + noise * 0.5,
      z + noise
    );
  }

  geo.computeVertexNormals();

  return geo;
}

/* =========================
   CREATE MONSTROUS FORMS
========================= */

for(let i=0;i<120;i++){

  const geometry = createChaosGeometry(
    Math.random() * 6 + 2
  );

  const material = new THREE.MeshStandardMaterial({
    color:new THREE.Color(
      `hsl(${40 + Math.random()*30},100%,50%)`
    ),
    roughness:1,
    metalness:0.1,
    wireframe:Math.random() > 0.82,
    emissive:new THREE.Color(
      `hsl(${40 + Math.random()*30},100%,10%)`
    )
  });

  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(
    (Math.random()-0.5)*900,
    (Math.random()-0.5)*500,
    (Math.random()-0.5)*500
  );

  mesh.rotation.set(
    Math.random()*Math.PI,
    Math.random()*Math.PI,
    Math.random()*Math.PI
  );

  scene.add(mesh);

  particles.push(mesh);

  velocities.push(
    new THREE.Vector3(
      (Math.random()-0.5)*0.5,
      (Math.random()-0.5)*0.5,
      (Math.random()-0.5)*0.5
    )
  );
}

/* =========================
   MASSIVE WORD STREAM
========================= */

const wordElements = [];

for(let i=0;i<WORDS.length;i++){

  const div = document.createElement("div");

  div.className = "word";
  div.innerText = WORDS[i];

  div.style.left = Math.random()*window.innerWidth + "px";
  div.style.top = Math.random()*window.innerHeight + "px";

  div.style.fontSize =
    (12 + Math.random()*40) + "px";

  document.body.appendChild(div);

  wordElements.push({
    el:div,
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    vx:(Math.random()-0.5)*3,
    vy:(Math.random()-0.5)*3
  });
}

/* =========================
   AUDIO NOISE
========================= */

let audioStarted = false;

window.addEventListener("click", () => {

  if(audioStarted) return;

  audioStarted = true;

  const ctx = new AudioContext();

  const noise = ctx.createBufferSource();

  const buffer = ctx.createBuffer(
    1,
    ctx.sampleRate * 2,
    ctx.sampleRate
  );

  const data = buffer.getChannelData(0);

  for(let i=0;i<data.length;i++){
    data[i] = Math.random()*2-1;
  }

  noise.buffer = buffer;
  noise.loop = true;

  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 120;

  const gain = ctx.createGain();
  gain.gain.value = 0.08;

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  noise.start();

});

/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(animate);

  const time = performance.now() * 0.001;

  camera.position.x +=
    ((mouse.x * 120) - camera.position.x) * 0.03;

  camera.position.y +=
    ((mouse.y * 80) - camera.position.y) * 0.03;

  camera.lookAt(scene.position);

  /* VISITOR FORCE FIELD */

  particles.forEach((p,i)=>{

    const target = new THREE.Vector3(
      mouse.x * 300,
      mouse.y * 180,
      0
    );

    const dir = target.clone().sub(p.position);

    const dist = dir.length();

    if(dist < 300){

      dir.normalize();

      velocities[i].add(
        dir.multiplyScalar(0.04)
      );

    }

    velocities[i].multiplyScalar(0.985);

    p.position.add(velocities[i]);

    p.rotation.x += 0.003;
    p.rotation.y += 0.004;

    /* LIVING DEFORMATION */

    const scale =
      1 +
      Math.sin(time*2 + i) * 0.25;

    p.scale.set(
      scale,
      scale * (1 + velocities[i].length()),
      scale
    );

  });

  /* WORD DESTRUCTION */

  wordElements.forEach((w,i)=>{

    w.x += w.vx;
    w.y += w.vy;

    const dx =
      mouse.x * window.innerWidth - w.x;

    const dy =
      mouse.y * window.innerHeight - w.y;

    const d = Math.sqrt(dx*dx + dy*dy);

    if(d < 250){

      w.vx += dx * 0.0008;
      w.vy += dy * 0.0008;

      w.el.style.transform =
        `scale(${1.4 + Math.sin(time*6+i)*0.3})
         rotate(${Math.sin(time+i)*20}deg)`;

      w.el.style.opacity = "1";

    } else {

      w.el.style.opacity = ".35";
    }

    w.vx *= 0.99;
    w.vy *= 0.99;

    /* SCREEN WRAP */

    if(w.x < -400) w.x = window.innerWidth+200;
    if(w.x > window.innerWidth+400) w.x = -200;

    if(w.y < -100) w.y = window.innerHeight+100;
    if(w.y > window.innerHeight+100) w.y = -100;

    w.el.style.left = w.x + "px";
    w.el.style.top = w.y + "px";

  });

  /* LIGHT MOVEMENT */

  lightA.position.x =
    Math.sin(time*0.4) * 400;

  lightA.position.z =
    Math.cos(time*0.4) * 400;

  renderer.render(scene,camera);
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>

</body>
</html>
