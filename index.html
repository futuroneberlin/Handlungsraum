<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Semantic PDF 3D Space</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div id="ui">
  <input type="file" id="pdfUpload" />
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";

// -----------------------------
// 3D SETUP
// -----------------------------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.z = 80;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT = semantic clarity
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(50, 50, 50);
scene.add(light);

// -----------------------------
// CORE GRAVITY NODE (THEORY CENTER)
// -----------------------------
const coreGeometry = new THREE.SphereGeometry(5, 32, 32);
const coreMaterial = new THREE.MeshBasicMaterial({ color: 0xff00ff });
const core = new THREE.Mesh(coreGeometry, coreMaterial);
scene.add(core);

// -----------------------------
// DATA STRUCTURES
// -----------------------------
let nodes = [];
let velocity = [];

// -----------------------------
// PDF LOADER
// -----------------------------
document.getElementById("pdfUpload").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  const buffer = await file.arrayBuffer();

  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

  let textChunks = [];

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();

    const strings = content.items.map(item => item.str).join(" ");
    textChunks.push(...strings.split(".").map(s => s.trim()).filter(Boolean));
  }

  buildSemanticField(textChunks);
});

// -----------------------------
// SEMANTIC PARSER (LIGHTWEIGHT)
// -----------------------------
function semanticWeight(word) {
  const strong = ["space", "practice", "body", "social", "aesthetic", "action", "system"];
  return strong.includes(word.toLowerCase()) ? 2 : 1;
}

// -----------------------------
// BUILD 3D FIELD
// -----------------------------
function buildSemanticField(chunks) {

  // reset
  nodes.forEach(n => scene.remove(n));
  nodes = [];
  velocity = [];

  chunks.forEach((txt, i) => {

    const size = Math.random() * 1.5 + 0.5;

    const geo = new THREE.SphereGeometry(size, 8, 8);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(`hsl(${Math.random()*360}, 100%, 60%)`)
    });

    const mesh = new THREE.Mesh(geo, mat);

    mesh.position.set(
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 50
    );

    mesh.userData = {
      text: txt,
      weight: semanticWeight(txt)
    };

    scene.add(mesh);
    nodes.push(mesh);

    velocity.push(new THREE.Vector3(
      (Math.random() - 0.5) * 0.2,
      (Math.random() - 0.5) * 0.2,
      (Math.random() - 0.5) * 0.2
    ));
  });
}

// -----------------------------
// ANIMATION LOOP (EXPANDING SPACE)
// -----------------------------
function animate() {
  requestAnimationFrame(animate);

  core.rotation.y += 0.002;

  nodes.forEach((n, i) => {

    // gravity toward core
    const dir = new THREE.Vector3()
      .subVectors(core.position, n.position)
      .normalize()
      .multiplyScalar(0.02 * n.userData.weight);

    velocity[i].add(dir);

    // expansion force (breathing space)
    const expand = n.position.clone().normalize().multiplyScalar(0.01);
    velocity[i].add(expand);

    n.position.add(velocity[i]);

    // damping
    velocity[i].multiplyScalar(0.98);

    // pulsing = semantic intensity
    n.scale.setScalar(1 + Math.sin(Date.now()*0.002 + i) * 0.3);
  });

  renderer.render(scene, camera);
}

animate();

// -----------------------------
// RESIZE
// -----------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
