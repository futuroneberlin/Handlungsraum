<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<title>INSTALLATION AI — SOCIAL SCULPTURE MODE</title>



<style>

  body { margin:0; overflow:hidden; background:black; }

  canvas { display:block; }

</style>



<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

</head>



<body>



<script>

console.log("🟣 INSTALLATION AI ACTIVE");



/* =========================

   BASIC SCENE

========================= */

const scene = new THREE.Scene();



const camera = new THREE.PerspectiveCamera(

  70, innerWidth/innerHeight, 0.1, 2000

);

camera.position.z = 180;



const renderer = new THREE.WebGLRenderer({ antialias:true });

renderer.setSize(innerWidth, innerHeight);

document.body.appendChild(renderer.domElement);



/* LIGHT FIELD */

scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const light = new THREE.PointLight(0xff00ff, 2);

light.position.set(100,100,100);

scene.add(light);



/* CORE (SOCIAL GRAVITY CENTER) */

const core = new THREE.Mesh(

  new THREE.SphereGeometry(12, 32, 32),

  new THREE.MeshStandardMaterial({

    color: 0xff00ff,

    emissive: 0x550055,

    emissiveIntensity: 0.8

  })

);

scene.add(core);



/* =========================

   TEXT FIELD (CONCEPTUAL ENGINE)

========================= */

let words = [

  "Instrumentalisierung",

  "Potenzial",

  "Transformation",

  "Resonanz",

  "Kraft",

  "Vermögen",

  "Handlung",

  "Raum",

  "Zeit",

  "Kollektiv",

  "Interaktion",

  "Form",

  "Wahrnehmung",

  "Struktur"

];



/* =========================

   STATE

========================= */

const nodes = [];

const velocity = [];



/* mouse = visitor force */

const mouse = new THREE.Vector3(0,0,0);



addEventListener("mousemove",(e)=>{

  mouse.x = (e.clientX / innerWidth - 0.5) * 2;

  mouse.y = -(e.clientY / innerHeight - 0.5) * 2;

});



/* =========================

   BUILD SYSTEM

========================= */

function spawnWord(text){



  const geo = new THREE.SphereGeometry(2.5, 16, 16);

  const mat = new THREE.MeshStandardMaterial({

    color: new THREE.Color(`hsl(${Math.random()*360},100%,60%)`)

  });



  const m = new THREE.Mesh(geo, mat);



  m.position.set(

    (Math.random()-0.5)*120,

    (Math.random()-0.5)*80,

    (Math.random()-0.5)*120

  );



  m.userData = {

    text,

    chaos: Math.random()

  };



  scene.add(m);

  nodes.push(m);

  velocity.push(new THREE.Vector3());

}



/* initial field */

words.forEach(spawnWord);



/* =========================

   SELF-ORGANIZING LOGIC

========================= */

function updateSystem(){



  // visitor force = mouse acts like gravity field

  const visitorForce = new THREE.Vector3(mouse.x*60, mouse.y*60, 0);



  nodes.forEach((n,i)=>{



    // core attraction

    let toCore = new THREE.Vector3()

      .subVectors(core.position, n.position)

      .multiplyScalar(0.008);



    // mouse attraction (visitor = sculptor)

    let toVisitor = new THREE.Vector3()

      .subVectors(visitorForce, n.position)

      .multiplyScalar(0.004);



    // chaotic drift (social instability)

    let chaos = new THREE.Vector3(

      Math.sin(Date.now()*0.001 + i)*0.2,

      Math.cos(Date.now()*0.001 + i)*0.2,

      Math.sin(Date.now()*0.0015 + i)*0.2

    );



    velocity[i].add(toCore);

    velocity[i].add(toVisitor);

    velocity[i].add(chaos);



    velocity[i].multiplyScalar(0.90);



    n.position.add(velocity[i]);



    // BREATHING = living matter

    const s = 1.2 + Math.sin(Date.now()*0.002 + i)*0.4;

    n.scale.setScalar(s);



    // TEXT REORGANIZATION (soft mutation)

    if(Math.random() < 0.002){

      n.userData.text =

        words[Math.floor(Math.random()*words.length)];

    }

  });



  // CORE also reacts

  core.rotation.y += 0.003;

  core.scale.setScalar(1 + Math.sin(Date.now()*0.001)*0.1);

}



/* =========================

   TEXT MUTATION EVENT

========================= */

setInterval(()=>{



  // social sculpture mutation event

  for(let i=0;i<2;i++){

    const t = words[Math.floor(Math.random()*words.length)];

    spawnWord(t);

  }



  // prevent overflow

  if(nodes.length > 120){

    const m = nodes.shift();

    scene.remove(m);

    velocity.shift();

  }



}, 2500);



/* =========================

   RENDER LOOP

========================= */

function animate(){



  requestAnimationFrame(animate);



  updateSystem();



  renderer.render(scene,camera);

}



animate();



/* =========================

   RESIZE

========================= */

addEventListener("resize",()=>{

  camera.aspect = innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

});

</script>



</body>
