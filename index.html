<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Social Sculpture Museum Mode</title>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>

  <!-- THREE.JS (NO LOCAL FILE NEEDED) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- PDF.JS -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.js"></script>
</head>

<body>

<script>
/* =========================
   PDF WORKER SETUP
========================= */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.js";

/* =========================
   BASIC THREE SETUP
========================= */
let scene, camera, renderer;
let nodes = [];
let velocity = [];

let core;

/* mouse */
let mouse = new THREE.Vector2();
let raycaster = new THREE.Raycaster();
let selected = null;
let dragging = false;

/* =========================
   INIT WORLD
========================= */
init();
bootstrap();
animate();
mouseInteraction();

/* =========================
   SCENE
========================= */
function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  camera.position.z = 80;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.PointLight(0xffffff, 2);
  light.position.set(50, 50, 50);
  scene.add(light);

  createCore();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

/* =========================
   CORE (THEORY CENTER)
========================= */
function createCore() {
  const geo = new THREE.SphereGeometry(6, 32, 32);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff00ff });

  core = new THREE.Mesh(geo, mat);
  scene.add(core);
}

/* =========================
   PDF LOADER (SAFE)
========================= */
async function loadPDF(file) {

  try {
    const pdf = await pdfjsLib.getDocument("./pdf/" + file).promise;

    let chunks = [];

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      const text = content.items.map(i => i.str).join(" ");

      chunks.push(
        ...text.split(".").map(t => t.trim()).filter(Boolean)
      );
    }

    return chunks;

  } catch (e) {

    console.warn("FALLBACK PDF:", file);

    return [
      "fallback semantic fragment",
      "social sculpture active",
      "museum mode running",
      "actional space emerging"
    ];
  }
}

/* =========================
   BOOTSTRAP PIPELINE (NO FAIL)
========================= */
async function bootstrap() {

  const files = [
    "handlungsraum.pdf",
    "kunstraum.pdf"
  ];

  let data = [];

  for (const f of files) {
    const chunks = await loadPDF(f);
    data.push(...chunks);
  }

  if (data.length === 0) {
    data = ["system auto-generated field"];
  }

  buildField(data);
}

/* =========================
   BUILD FIELD
========================= */
function buildField(chunks) {

  chunks.forEach((t, i) => {

    const geo = new THREE.SphereGeometry(1.5, 10, 10);

    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(`hsl(${Math.random()*360},100%,60%)`)
    });

    const mesh = new THREE.Mesh(geo, mat);

    mesh.position.set(
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60,
      (Math.random() - 0.5) * 60
    );

    mesh.userData.text = t;

    scene.add(mesh);

    nodes.push(mesh);
    velocity.push(new THREE.Vector3());
  });
}

/* =========================
   ANIMATION LOOP
========================= */
function animate() {

  requestAnimationFrame(animate);

  if (!core) return;

  core.rotation.y += 0.002;

  nodes.forEach((n, i) => {

    // drag override
    if (selected === n && dragging) {
      n.position.x = mouse.x * 40;
      n.position.y = mouse.y * 40;
      return;
    }

    // gravity to core
    const dir = new THREE.Vector3()
      .subVectors(core.position, n.position)
      .multiplyScalar(0.01);

    velocity[i].add(dir);
    velocity[i].multiplyScalar(0.92);

    n.position.add(velocity[i]);

    n.scale.setScalar(
      1 + Math.sin(Date.now() * 0.002 + i) * 0.2
    );
  });

  renderer.render(scene, camera);
}

/* =========================
   MOUSE INTERACTION (DRAG SYSTEM)
========================= */
function mouseInteraction() {

  window.addEventListener("mousemove", (e) => {

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const hits = raycaster.intersectObjects(nodes);

    document.body.style.cursor =
      (!dragging && hits.length) ? "pointer" : "default";
  });

  window.addEventListener("mousedown", () => {

    raycaster.setFromCamera(mouse, camera);

    const hits = raycaster.intersectObjects(nodes);

    if (hits.length) {
      selected = hits[0].object;
      dragging = true;
    }
  });

  window.addEventListener("mouseup", () => {
    selected = null;
    dragging = false;
  });
}
</script>

</body>
</html>
