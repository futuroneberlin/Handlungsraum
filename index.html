<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HANDLUNGSRAUM — INSTALLATION ENGINE</title>

<style>
html, body {
  margin:0;
  overflow:hidden;
  background:#000;
  width:100%;
  height:100%;
  font-family:Arial, sans-serif;
}

canvas {
  display:block;
}

#overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  background:
    radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.55) 100%);
  mix-blend-mode: multiply;
}

.word {
  position:absolute;
  color:#ffcc00;
  font-weight:bold;
  white-space:nowrap;
  pointer-events:none;
  mix-blend-mode:screen;
  text-shadow:0 0 12px rgba(255,200,0,0.7);
}
</style>
</head>

<body>

<div id="overlay"></div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

console.log("🏛 HANDLUNGSRAUM ONLINE");

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000000,0.003);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  2000
);

camera.position.set(0,20,180);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT
========================= */

const ambient = new THREE.AmbientLight(0x404040,2);
scene.add(ambient);

const light1 = new THREE.PointLight(0xffaa00,4,800);
light1.position.set(200,120,100);
scene.add(light1);

const light2 = new THREE.PointLight(0x00ffff,2,600);
light2.position.set(-150,-100,200);
scene.add(light2);

/* =========================
   TEXT MATERIAL
========================= */

const TEXT = `
HANDLUNGSRAUM
SOZIALE PLASTIK
RESONANZ
TRANSFORMATION
WIDERSTAND
FORMBARKEIT
INTERAKTION
ZEIT
KÖRPER
KRAFT
VERMÖGEN
NICHTSTANDARDISIERUNG
ÄSTHETISCHE PRAXIS
OFFENER RAUM
REIBUNG
PROCESS
SCULPTURAL SPACE
SOCIAL SCULPTURE
ACTION SPACE
FLUID STRUCTURE
`;

const words = TEXT.split(/\s+/);

/* =========================
   CENTRAL SCULPTURE
========================= */

const sculptureGroup = new THREE.Group();
scene.add(sculptureGroup);

function createChunk(size){

  const geo = new THREE.BoxGeometry(size,size,size,8,8,8);

  const pos = geo.attributes.position;

  for(let i=0;i<pos.count;i++){

    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);

    const distortion =
      Math.sin(x*0.2)*4 +
      Math.cos(y*0.3)*4 +
      (Math.random()-0.5)*8;

    pos.setXYZ(
      i,
      x + distortion,
      y + distortion*0.5,
      z + distortion
    );
  }

  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color:0x222222,
    roughness:1,
    metalness:0.1,
    emissive:0x111111
  });

  const mesh = new THREE.Mesh(geo,mat);

  mesh.position.set(
    (Math.random()-0.5)*80,
    (Math.random()-0.5)*80,
    (Math.random()-0.5)*80
  );

  mesh.rotation.set(
    Math.random()*Math.PI,
    Math.random()*Math.PI,
    Math.random()*Math.PI
  );

  sculptureGroup.add(mesh);

  return mesh;
}

const chunks = [];

for(let i=0;i<45;i++){

  chunks.push(createChunk(
    8 + Math.random()*20
  ));
}

/* =========================
   PARTICLE FIELD
========================= */

const particleGeo = new THREE.BufferGeometry();

const particleCount = 4000;

const positions = [];

for(let i=0;i<particleCount;i++){

  positions.push(
    (Math.random()-0.5)*1000,
    (Math.random()-0.5)*1000,
    (Math.random()-0.5)*1000
  );
}

particleGeo.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(positions,3)
);

const particleMat = new THREE.PointsMaterial({
  color:0xffffff,
  size:1.2
});

const particles = new THREE.Points(
  particleGeo,
  particleMat
);

scene.add(particles);

/* =========================
   WORD STREAMS
========================= */

const domWords = [];

for(let i=0;i<120;i++){

  const el = document.createElement("div");

  el.className = "word";

  el.innerText =
    words[Math.floor(Math.random()*words.length)];

  el.style.fontSize =
    10 + Math.random()*40 + "px";

  document.body.appendChild(el);

  domWords.push({
    el,
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    speed:0.2 + Math.random()*2
  });
}

/* =========================
   MOUSE FIELD
========================= */

const mouse = {
  x:0,
  y:0
};

window.addEventListener("mousemove",(e)=>{

  mouse.x =
    (e.clientX/window.innerWidth -0.5)*2;

  mouse.y =
    (e.clientY/window.innerHeight -0.5)*2;
});

/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(animate);

  const t = performance.now()*0.001;

  sculptureGroup.rotation.y += 0.001;
  sculptureGroup.rotation.x += 0.0003;

  chunks.forEach((c,i)=>{

    c.position.y +=
      Math.sin(t+i)*0.05;

    c.rotation.x += 0.002;
    c.rotation.y += 0.001;

    const scale =
      1 + Math.sin(t*2+i)*0.08;

    c.scale.set(scale,scale,scale);

    c.position.x += mouse.x*0.05;
    c.position.y += -mouse.y*0.05;
  });

  particles.rotation.y += 0.0004;

  domWords.forEach((w,i)=>{

    w.y -= w.speed;

    if(w.y < -100){

      w.y = window.innerHeight + 100;
    }

    const distortion =
      Math.sin(t+i)*50;

    w.el.style.transform =
      `translate(${w.x + distortion}px,${w.y}px)
       rotate(${Math.sin(t+i)*20}deg)`;

    w.el.style.opacity =
      0.4 + Math.sin(t+i)*0.6;
  });

  light1.position.x =
    Math.sin(t*0.5)*300;

  light1.position.z =
    Math.cos(t*0.5)*300;

  renderer.render(scene,camera);
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{

  camera.aspect =
    window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>

</body>
</html>
