<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diplom: Kunst als menschliche Praxis & Erfahrung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #overlay-ui {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            max-width: 400px;
            pointer-events: none;
            background: rgba(10, 10, 10, 0.85);
            padding: 20px;
            border-left: 3px solid #ff3366;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #ff3366;
        }
        p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #cccccc;
            margin-bottom: 15px;
        }
        .status-box {
            font-size: 0.75rem;
            background: #1a1a1a;
            padding: 8px;
            border: 1px solid #333;
            color: #00ff66;
        }
        #interaction-prompt {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #666;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="overlay-ui">
        <h1>Handlungsraum: Soziale Plastik</h1>
        <p>Ein virtueller unendlicher Raum basierend auf John Dewey (Kunst als Erfahrung) & Georg Bertram (Kunst als menschliche Praxis).</p>
        <div class="status-box" id="data-status">Lade Live-Daten zur Sozialen Plastik...</div>
    </div>

    <div id="interaction-prompt">BEWEGE DIE MAUS, UM DEN RAUM ZU FORMEN</div>

    <div id="canvas-container">
        <canvas id="spaceCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        const statusBox = document.getElementById('data-status');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };
        let concepts = [];
        let particles = [];
        const maxParticles = 150;

        // 1. Wikipedia API Integration: Daten zum Thema "Soziale Plastik" ziehen
        async function fetchSocialPlasticData() {
            try {
                statusBox.innerText = "Verbinde mit Wikipedia-Netzwerk...";
                // Suche nach "Soziale Plastik" via Wikipedia API
                const response = await fetch(`https://de.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=Soziale_Plastik&format=json&origin=*`);
                const data = await response.json();
                
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                const extract = pages[pageId].extract;

                if (extract) {
                    // Text in prägnante Fragmente / Sätze zerlegen für die visuelle Matrix
                    const sentences = extract.split('. ').filter(s => s.trim().length > 10);
                    
                    // Standardtheorien aus deinen Dokumenten injizieren
                    concepts.push("John Dewey: Kunst als Erfahrung");
                    concepts.push("Georg Bertram: Kunst als menschliche Praxis");
                    concepts.push("Resonanz statt Resultat");
                    concepts.push("Bewertungsfreier Experimentierraum");

                    sentences.forEach((sentence) => {
                        if(concepts.length < 15) {
                            concepts.push(sentence.substring(0, 80) + "...");
                        }
                    });

                    statusBox.innerText = "Daten erfolgreich in Plastik transformiert.";
                    statusBox.style.color = "#00ff66";
                    initSpace();
                }
            } catch (error) {
                console.error("Fehler beim Datenabruf:", error);
                statusBox.innerText = "Offline-Modus: Nutze lokale Konzeptideen.";
                statusBox.style.color = "#ff3366";
                // Fallback-Konzepte falls API blockiert ist
                concepts = [
                    "Joseph Beuys: Jeder Mensch ist ein Künstler",
                    "Soziale Plastik: Gestaltung der Gesellschaft",
                    "John Dewey: Ästhetische Erfahrung im Alltag",
                    "Georg Bertram: Praxis der Selbstverständigung",
                    "Form entsteht im kollaborativen Prozess",
                    "Widerstand, Veränderbarkeit, Formbarkeit"
                ];
                initSpace();
            }
        }

        // 2. Initialisierung des mathematischen unendlichen Raums
        function initSpace() {
            particles = [];
            for (let i = 0; i < maxParticles; i++) {
                particles.push({
                    x: Math.random() * width - width / 2,
                    y: Math.random() * height - height / 2,
                    z: Math.random() * width,
                    text: concepts[Math.floor(Math.random() * concepts.length)] || "Kollaborative Praxis",
                    isText: Math.random() > 0.7
                });
            }
        }

        // 3. Animation & Mathematische Transformation des Raums (3D Projektion)
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)'; // Erzeugt einen fließenden Bewegungsschleier (Erfahrungsprozess)
            ctx.fillRect(0, 0, width, height);

            // Sanfte Mausbewegung (Dämpfung)
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;

            // Zentrum berechnen basierend auf Benutzerinteraktion
            const centerX = width / 2 + (mouse.x - width / 2) * 0.5;
            const centerY = height / 2 + (mouse.y - height / 2) * 0.5;

            particles.forEach(p => {
                // Bewege Partikel/Texte auf der Z-Achse auf den Betrachter zu (Unendlicher Vorwärtsstrom)
                p.z -= 2; 

                if (p.z <= 0) {
                    p.z = width; // Setze zurück an den fernen Horizont (Endlosschleife)
                    p.x = Math.random() * width - width / 2;
                    p.y = Math.random() * height - height / 2;
                }

                // 3D zu 2D Projektion
                const k = 400 / p.z;
                const px = p.x * k + centerX;
                const py = p.y * k + centerY;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    const size = (width - p.z) / width * 3;
                    const alpha = (width - p.z) / width; // Verblassen im Vordergrund / Hintergrund

                    if (p.isText) {
                        // Zeichne die Live-Theorie-Fragmente als plastische Elemente im Raum
                        ctx.font = `${size * 6 + 10}px 'Courier New'`;
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                        ctx.fillText(p.text, px, py);
                    } else {
                        // Verbindungslinien und Datenpunkte (Das Beziehungsnetzwerk der sozialen Plastik)
                        ctx.beginPath();
                        ctx.arc(px, py, size * 2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 51, 102, ${alpha})`;
                        ctx.fill();
                    }
                }
            });

            requestAnimationFrame(animate);
